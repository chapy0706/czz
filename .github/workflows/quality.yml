# /.github/workflows/quality.yml
name: quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # まず pnpm を入れる（公式推奨）
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Quality gate (evidence)
        env:
          CI: "1"
          NO_COLOR: "1"
          FORCE_COLOR: "0"
          TERM: "dumb"
          VERIFY_MODE: "ci"
          REQUIRE_TYPECHECK: "1"
        run: make evidence

      - name: Upload evidence logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-logs
          path: out/evidence/*.log
